services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://location:location@db:5432/location
      ENVIRONMENT: local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: location
      POSTGRES_PASSWORD: location
      POSTGRES_DB: location
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U location -d location"]
      interval: 5s
      timeout: 5s
      retries: 5
