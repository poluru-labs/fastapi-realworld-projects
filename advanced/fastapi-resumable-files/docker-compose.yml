services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://resumable:resumable@db:5432/resumable
      ENVIRONMENT: local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resumable
      POSTGRES_PASSWORD: resumable
      POSTGRES_DB: resumable
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumable -d resumable"]
      interval: 5s
      timeout: 5s
      retries: 5
